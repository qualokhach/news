name: AppNho News — research and prepare candidates
on:
  workflow_dispatch:
  schedule:
    # Research starts 60 minutes before each Vietnam-time publication slot.
    # Publish slots: 05:45, 11:45, 16:45 ICT; research slots: 04:45, 10:45, 15:45 ICT.
    - cron: "45 21 * * *" # 04:45 Vietnam
    - cron: "45 3 * * *"  # 10:45 Vietnam
    - cron: "45 8 * * *"  # 15:45 Vietnam
permissions:
  contents: write
concurrency:
  group: appnho-news-data
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate repository and research queue
        run: python scripts/audit_site.py
      - name: Run offline regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Audit feed health
        run: python scripts/audit_feeds.py
      - name: Discover and stage evidence-backed candidates (no AI/API calls)
        env:
          MAX_ARTICLES_PER_RUN: "8"
          MAX_CANDIDATE_GROUPS_PER_RUN: "8"
          NEWS_PUBLIC_FACTUAL_RESEARCH: "1"
        run: python scripts/news_pipeline.py
      - name: Verify research execution
        run: python scripts/check_run_health.py
      - name: Re-audit prepared candidates
        run: python scripts/audit_site.py
      - name: Commit research queue and discovery state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending.json data/seen_items.json data/research_queue.json
          if git diff --cached --quiet; then
            echo "No research queue changes to commit."
          else
            git commit -m "Prepare AppNho News research candidates"
            git push
          fi

  # Keep Research -> Writing in one workflow run. This avoids relying on a
  # separate workflow_run event, which is easy to miss when the listener is
  # absent from the default branch or has not yet been enabled there.
  write_staged:
    needs: research
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the latest branch state after Research commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate repository and research queue
        run: python scripts/audit_site.py

      - name: Run offline regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Write newly staged candidates with AI providers
        id: writing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_APPNHO_NEWS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_APPNHO_NEWS }}
          MAX_ARTICLES_PER_SLOT: "3"
        run: python scripts/write_candidates.py

      - name: Validate queue after writing
        run: python scripts/audit_site.py

      - name: Commit writing results and provider diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research_queue.json data/pending.json data/seen_items.json
          if git diff --cached --quiet; then
            echo "No writing queue changes to commit."
          else
            git commit -m "Write AppNho News staged candidates"
            git push
          fi

      - name: Mark run failed when all AI writing attempts failed
        if: steps.writing.outputs.no_article_failure == 'true'
        run: |
          echo "All configured AI providers failed for the attempted candidates. Queue diagnostics were committed; inspect the writing logs."
          exit 1
