name: AppNho News — research and prepare candidates
on:
  workflow_dispatch:
  schedule:
    # Research runs ahead of the publication slots; it only prepares candidates.
    - cron: "0 2,7,14,20 * * *"
permissions:
  contents: write
concurrency:
  group: appnho-news-data
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate repository and research queue
        run: python scripts/audit_site.py
      - name: Run offline regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Audit feed health
        run: python scripts/audit_feeds.py
      - name: Verify at least one AI provider key is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_APPNHO_NEWS }}
          XAI_API_KEY: ${{ secrets.GROK_API_APPNHO_NEWS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_APPNHO_NEWS }}
        run: |
          if [ -z "$GEMINI_API_KEY$XAI_API_KEY$OPENROUTER_API_KEY" ]; then
            echo "ERROR: No AI provider secret is configured."
            exit 1
          fi
          echo "At least one AI provider secret is present. Values are not printed."
      - name: Verify provider authentication and eligible models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_APPNHO_NEWS }}
          XAI_API_KEY: ${{ secrets.GROK_API_APPNHO_NEWS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_APPNHO_NEWS }}
        run: python scripts/check_ai_providers.py
      - name: Discover, research and prepare candidates (does not publish)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_APPNHO_NEWS }}
          XAI_API_KEY: ${{ secrets.GROK_API_APPNHO_NEWS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_APPNHO_NEWS }}
          MAX_ARTICLES_PER_RUN: "8"
          MAX_GEMINI_CALLS_PER_RUN: "12"
          MAX_CANDIDATE_GROUPS_PER_RUN: "40"
          MAX_GROK_CALLS_PER_RUN: "3"
          MAX_OPENROUTER_CALLS_PER_RUN: "8"
          NEWS_PUBLIC_FACTUAL_RESEARCH: "1"
        run: python scripts/news_pipeline.py
      - name: Verify research execution
        run: python scripts/check_run_health.py
      - name: Re-audit prepared candidates
        run: python scripts/audit_site.py
      - name: Commit research queue and discovery state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending.json data/seen_items.json data/research_queue.json
          if git diff --cached --quiet; then
            echo "No research queue changes to commit."
          else
            git commit -m "Prepare AppNho News research candidates"
            git push
          fi
