name: AppNho News — publish manual article
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Tiêu đề bài viết"
        required: true
        type: string
      category:
        description: "Chuyên mục"
        required: true
        type: choice
        options: [vietnam, world, sports, technology]
      summary:
        description: "Tóm tắt bài viết"
        required: true
        type: string
      body:
        description: "Ngữ cảnh tham khảo (ít nhất 100 từ); chỉ dùng để nhận diện đề tài, không xuất bản nguyên văn"
        required: true
        type: string
      source_name:
        description: "Tên nguồn tham khảo (nếu có)"
        required: false
        type: string
      source_url:
        description: "HTTPS URL nguồn để hệ thống nghiên cứu/xác minh"
        required: true
        type: string
      keywords:
        description: "Từ khóa gợi ý, cách nhau bằng dấu phẩy (không xuất bản trực tiếp)"
        required: false
        type: string
      source_published_at:
        description: "Thời điểm công bố của nguồn, bắt buộc theo ISO-8601 để tránh gán sai ngày"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: appnho-news-data
  cancel-in-progress: false
jobs:
  queue_research_lead:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Stage research lead (no direct publication)
        env:
          ARTICLE_TITLE: ${{ inputs.title }}
          ARTICLE_CATEGORY: ${{ inputs.category }}
          ARTICLE_SUMMARY: ${{ inputs.summary }}
          ARTICLE_BODY: ${{ inputs.body }}
          ARTICLE_SOURCE_NAME: ${{ inputs.source_name }}
          ARTICLE_SOURCE_URL: ${{ inputs.source_url }}
          ARTICLE_KEYWORDS: ${{ inputs.keywords }}
          ARTICLE_SOURCE_PUBLISHED_AT: ${{ inputs.source_published_at }}
        run: python scripts/manual_publish.py
      - name: Commit research lead only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending.json data/seen_items.json
          git commit -m "Queue AppNho News research lead"
          git push
