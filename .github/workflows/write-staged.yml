name: AppNho News — write staged candidates

on:
  # Manual recovery only. Automatic Research -> Writing is a dependent job
  # in research-news.yml so it cannot be lost as a separate workflow_run event.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appnho-news-data
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout latest repository state
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate repository and research queue
        run: python scripts/audit_site.py

      - name: Run offline regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Write staged candidates with AI providers
        id: writing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_APPNHO_NEWS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_APPNHO_NEWS }}
          MAX_ARTICLES_PER_SLOT: '3'
        run: python scripts/write_candidates.py

      - name: Validate queue after writing
        run: python scripts/audit_site.py

      - name: Commit writing results and provider diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research_queue.json data/pending.json data/seen_items.json
          if git diff --cached --quiet; then
            echo "No writing queue changes to commit."
          else
            git commit -m "Prepare AppNho News ready articles"
            git push
          fi

      - name: Mark run failed when all AI writing attempts failed
        if: steps.writing.outputs.no_article_failure == 'true'
        run: |
          echo "All configured AI providers failed for the attempted candidates. Queue diagnostics were committed; inspect the writing logs."
          exit 1
