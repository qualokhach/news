name: AppNho News — validate code and content data
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Run regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Audit repository, source queue and article metadata
        run: python scripts/audit_site.py
