name: AppNho News — collect, write and publish
on:
  workflow_dispatch:
    inputs:
      rebuild_digest:
        description: "Rebuild today's digest using the corrected 24-hour selection rules"
        required: false
        type: boolean
        default: false
  # Run once when pipeline code/config changes, but not on bot data commits.
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-news.yml'
      - 'scripts/**'
      - 'config/feeds.json'
  schedule:
    # 06:00 and 17:00 Vietnam time (UTC+7); keep the existing audit-compatible schedule.
    - cron: "0 23,10 * * *"
    # 12:00 Vietnam time (UTC+7), dedicated digest run.
    - cron: "0 5 * * *"
permissions:
  contents: write
concurrency:
  group: appnho-news-pipeline
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate repository data and category/archive integrity
        run: python scripts/audit_site.py
      - name: Run offline pipeline regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Audit feed health (continue when individual sources fail)
        run: python scripts/audit_feeds.py
      - name: Verify at least one AI provider secret is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_APPNHO_NEWS }}
          XAI_API_KEY: ${{ secrets.GROK_API_APPNHO_NEWS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_APPNHO_NEWS }}
        run: |
          if [ -z "$GEMINI_API_KEY$XAI_API_KEY$OPENROUTER_API_KEY" ]; then
            echo "ERROR: No AI provider secret is configured; automatic article generation cannot run."
            exit 1
          fi
          echo "At least one AI provider secret is present. Values are not printed."
      - name: Collect, write and publish to GitHub JSON archive
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_APPNHO_NEWS }}
          XAI_API_KEY: ${{ secrets.GROK_API_APPNHO_NEWS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_APPNHO_NEWS }}
          MAX_ARTICLES_PER_RUN: ${{ github.event_name == 'schedule' && github.event.schedule == '0 5 * * *' && '0' || '4' }}
        run: python scripts/news_pipeline.py
      - name: Create or rebuild noon digest
        if: (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') || (github.event_name == 'workflow_dispatch' && inputs.rebuild_digest)
        env:
          REBUILD_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_digest && '1' || '0' }}
        run: python scripts/create_digest.py
      - name: Verify pipeline actually reached feeds and AI configuration
        run: python scripts/check_run_health.py
      - name: Summarize article generation result
        if: always()
        run: |
          python - <<'PY2'
          import json, os
          from pathlib import Path
          p=Path('data/seen_items.json')
          state=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          stats=state.get('last_run_stats', {}) if isinstance(state, dict) else {}
          lines=[
            '## AppNho News run summary',
            f"- Enabled feeds: {stats.get('feeds_enabled', 0)}",
            f"- Successful feeds: {stats.get('feeds_succeeded', 0)}",
            f"- New leads in this window: {stats.get('new_leads_in_window', 0)}",
            f"- AI keys configured (count only): {stats.get('api_keys_configured', 0)}",
            f"- AI generation attempts: {stats.get('generation_attempts', 0)}",
            f"- Valid AI responses: {stats.get('ai_responses', 0)}",
            f"- Articles published this run: {stats.get('published', 0)}",
            f"- Feed failures: {stats.get('feed_failures', 0)}",
            f"- Generation failures: {stats.get('generation_failures', 0)}",
          ]
          if stats.get('published', 0) == 0:
            lines.append('- Note: zero publication is not automatically an error; inspect lead counts, provider warnings and quality rejections in the job log.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
            f.write('\n'.join(lines) + '\n')
          PY2
      - name: Re-audit article data after generation
        run: python scripts/audit_site.py
      - name: Close 30-day article batch when due
        run: python scripts/rotate_archive.py
      - name: Validate archive rotation result
        run: python scripts/audit_site.py
      - name: Rebuild RSS and sitemap
        run: python scripts/build_metadata.py
      - name: Commit updated articles and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/ sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo "No repository data changes to commit."
          else
            git commit -m "Update AppNho News archive"
            git push
          fi
