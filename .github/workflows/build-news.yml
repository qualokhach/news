name: AppNho News — collect, write and publish
on:
  workflow_dispatch:
  schedule:
    # 06:00 and 17:00 Vietnam time (UTC+7); GitHub may start a few minutes late.
    - cron: "0 23,10 * * *"
permissions:
  contents: write
concurrency:
  group: appnho-news-pipeline
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collect, write and publish to GitHub JSON archive
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_APPNHO_NEWS }}
          GROQ_API_KEY: ${{ secrets.GROK_API_APPNHO_NEWS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_APPNHO_NEWS }}
          MAX_ARTICLES_PER_RUN: "4"
        run: python scripts/news_pipeline.py
      - name: Close 30-day article batch when due
        run: python scripts/rotate_archive.py
      - name: Rebuild RSS and sitemap
        run: python scripts/build_metadata.py
      - name: Commit updated articles and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/archive_articles.json data/archive_catalog.json data/archive_manifest.json data/archive_batches data/pending.json data/seen_items.json sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo "No repository data changes to commit."
          else
            git commit -m "Update AppNho News archive [skip ci]"
            git push
          fi
