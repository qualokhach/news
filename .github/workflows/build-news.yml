name: AppNho News — finalize and publish by schedule
on:
  workflow_dispatch:
    inputs:
      slot_kind:
        description: "Loại phiên cần chạy thủ công"
        type: choice
        required: true
        default: regular
        options:
          - regular
          - digest
  schedule:
    # Three separate schedules are intentional: GitHub exposes the exact cron
    # expression in github.event.schedule, which selects the noon digest branch.
    - cron: "45 22 * * *" # 05:45 Vietnam
    - cron: "45 4 * * *"  # 11:45 Vietnam
    - cron: "45 9 * * *"  # 16:45 Vietnam
permissions:
  contents: write
concurrency:
  group: appnho-news-data
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Repair queue invariants (withdraw any READY candidate the audit would reject)
        run: python scripts/repair_queue.py
      - name: Validate repository and research queue
        run: python scripts/audit_site.py
      - name: Run offline regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Resolve exact publication slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_SLOT_KIND: ${{ inputs.slot_kind }}
        run: python scripts/resolve_publish_slot.py >> "$GITHUB_OUTPUT"
      - name: Write staged candidates with AI providers
        id: writing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_APPNHO_NEWS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_APPNHO_NEWS }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          MAX_ARTICLES_PER_SLOT: ${{ steps.slot.outputs.max_articles }}
        run: python scripts/write_candidates.py
      - name: Final source, freshness and quality gate; publish ready candidates
        env:
          MAX_ARTICLES_PER_SLOT: ${{ steps.slot.outputs.max_articles }}
          NEWS_SLOT_KIND: ${{ steps.slot.outputs.slot_kind }}
        run: python scripts/publish_ready.py
      - name: Build noon digest from AppNho articles only
        if: steps.slot.outputs.slot_kind == 'digest'
        run: python scripts/create_digest.py
      # Share previews, RSS, sitemap and social metadata must exist BEFORE the audit that
      # requires them. (Auditing first made every successful publication fail, skip the
      # commit and leave the website without the new articles.)
      - name: Build RSS, sitemap, share previews and social metadata for the new articles
        run: python scripts/build_metadata.py
      - name: Validate article data after publication
        run: python scripts/audit_site.py
      - name: Close 30-day AppNho publication batch when due
        run: python scripts/rotate_archive.py
      - name: Rebuild RSS, sitemap and social metadata after any rotation
        run: python scripts/build_metadata.py
      - name: Validate archive rotation
        run: python scripts/audit_site.py
      - name: Commit published articles and generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/research_queue.json data/pending.json data/seen_items.json data/publish_log.json data/archive_articles.json data/archive_catalog.json data/archive_manifest.json sitemap.xml feed.xml social_metadata.json share/
          # Archive batches are created only when a 30-day rotation actually closes.
          # Do not pass a missing (or still-empty) directory as a Git pathspec.
          if [ -d data/archive_batches ] && find data/archive_batches -type f -name '*.json' -print -quit | grep -q .; then
            git add -A -- data/archive_batches/
          fi
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "Publish scheduled AppNho News articles"
            git push
          fi
      - name: Mark run failed when all AI writing attempts failed
        if: steps.writing.outputs.no_article_failure == 'true'
        run: |
          echo "All staged article-writing attempts failed. Queue diagnostics were committed; review the writing logs before the next publish run."
          exit 1
